info:
  name: New Access Token -user-
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/token"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "user",
        "password": "p"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
