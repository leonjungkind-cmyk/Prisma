info:
  name: New Access Token -admin-
  type: http
  seq: 1

http:
  method: POST
  url: "{{oidcTokenUrl}}"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: "{{username}}"
      - name: password
        value: "{{password}}"
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{clientSecret}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accessToken", res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
