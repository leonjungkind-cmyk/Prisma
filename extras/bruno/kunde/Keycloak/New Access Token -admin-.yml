info:
  name: New Access Token -admin-
  type: http
  seq: 1

http:
  method: POST
  url: "{{oidcTokenUrl}}"
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: admin
      - name: password
        value: p
      - name: client_id
        value: javascript-client
      - name: client_secret
        value: Dv6hrjs5OWg4krSffeLz3UU7Igp695QD

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("accessToken", res.body.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
