opencollection: 1.0.0

info:
  name: kunde

config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: https://localhost:3000

    - name: keycloakUrl
      value: http://localhost:8880

    - name: realm
      value: javascript

    - name: realmUrl
      value: "{{keycloakUrl}}/realms/{{realm}}"

    - name: oidcUrl
      value: "{{realmUrl}}/protocol/openid-connect"

    - name: oidcTokenUrl
      value: "{{oidcUrl}}/token"

    - name: oidcAuthUrl
      value: "{{oidcUrl}}/auth"

    - name: clientId
      value: javascript-client

    - name: clientSecret
      value: Dv6hrjs5OWg4krSffeLz3UU7Igp695QD

    - name: username
      value: admin

    - name: password
      value: p
