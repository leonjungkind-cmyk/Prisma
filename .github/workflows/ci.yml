name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Bun installieren
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Dependencies installieren
        run: bun install

      - name: Prisma Client generieren
        run: bun prisma generate
        env:
          DATABASE_URL: postgresql://kunde:p@localhost:5432/kunde?schema=kunde

      - name: TypeScript prüfen
        run: bun run tsc

      - name: ESLint prüfen
        run: bun run eslint

      - name: Prettier prüfen
        run: bun run prettier:check
